services:
  # The .NET Application Service
  mafiacommunicationservice:
    image: mafiacommunicationservice
    build:
      context: .
      dockerfile: MafiaCommunicationService/Dockerfile
    container_name: mafia-comm-service-app
    ports:
      - "${SERVICE_PORT:-8080}:8080"
      - "${RPC_PORT:-6000}:6000"
    env_file:
      - .env
    environment:
      - ConnectionStrings__DefaultConnection=Host=comm-postgres-primary,comm-postgres-replica-1,comm-postgres-replica-2;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Target Session Attributes=read-write
    depends_on:
      postgres-primary:
        condition: service_healthy
    networks:
      - mafia-comm-service-net

  # Primary Database (Read/Write)
  postgres-primary:
    image: postgres:16-alpine
    container_name: comm-postgres-primary
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    command: |
      bash -c "
      # A. Script to allow Replicas to connect (updates pg_hba.conf)
      echo \"echo 'host replication all 0.0.0.0/0 scram-sha-256' >> /var/lib/postgresql/data/pg_hba.conf\" > /docker-entrypoint-initdb.d/01_init_hba.sh
      
      # B. SQL to create the missing Replication Slots
      echo \"SELECT 'init' FROM pg_create_physical_replication_slot('replica_1'); SELECT 'init' FROM pg_create_physical_replication_slot('replica_2');\" > /docker-entrypoint-initdb.d/02_init_slots.sql
      
      # C. Start the server
      exec docker-entrypoint.sh postgres -c wal_level=replica -c hot_standby=on -c max_wal_senders=10 -c max_replication_slots=10 -c hot_standby_feedback=on
      "
    volumes:
      - pg_comm_primary_data:/var/lib/postgresql/data
    networks:
      - mafia-comm-service-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Replica 1 (Read-Only)
  postgres-replica-1:
    image: postgres:16-alpine
    container_name: comm-postgres-replica-1
    restart: always
    depends_on:
      postgres-primary:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: |
      bash -c "
      rm -rf /var/lib/postgresql/data/*
      chown -R postgres:postgres /var/lib/postgresql/data
      chmod 0700 /var/lib/postgresql/data

      # Connects to 'comm-postgres-primary'
      until su-exec postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replica_1 --host=comm-postgres-primary --port=5432 --username=${POSTGRES_USER} --no-password; do
        echo 'Waiting for primary to connect...'
        sleep 1s
      done
      
      exec su-exec postgres postgres -c hot_standby=on
      "
    volumes:
      - pg_comm_replica1_data:/var/lib/postgresql/data
    networks:
      - mafia-comm-service-net

  # Replica 2 (Read-Only)
  postgres-replica-2:
    image: postgres:16-alpine
    container_name: comm-postgres-replica-2
    restart: always
    depends_on:
      postgres-primary:
        condition: service_healthy
    env_file:
      - .env
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    command: |
      bash -c "
      rm -rf /var/lib/postgresql/data/*
      chown -R postgres:postgres /var/lib/postgresql/data
      chmod 0700 /var/lib/postgresql/data

      # Connects to 'comm-postgres-primary'
      until su-exec postgres pg_basebackup --pgdata=/var/lib/postgresql/data -R --slot=replica_2 --host=comm-postgres-primary --port=5432 --username=${POSTGRES_USER} --no-password; do
        echo 'Waiting for primary to connect...'
        sleep 1s
      done
      
      exec su-exec postgres postgres -c hot_standby=on
      "
    volumes:
      - pg_comm_replica2_data:/var/lib/postgresql/data
    networks:
      - mafia-comm-service-net

networks:
  mafia-comm-service-net:
    driver: bridge

volumes:
  pg_comm_primary_data:
  pg_comm_replica1_data:
  pg_comm_replica2_data: